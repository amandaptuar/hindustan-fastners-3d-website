<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bolt & Nut Test</title>
  <style>
    body { background: #f4ede0; display: flex; gap: 40px; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Realistic 3D Hex Nut</h3>
    <!-- Nut SVG here -->
    <svg width="120" height="120" viewBox="0 0 100 100" fill="none" style="filter: drop-shadow(0 14px 22px rgba(120, 80, 10, 0.42));">
      <defs>
        <linearGradient id="topFace" x1="18" y1="10" x2="82" y2="66" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#FFF7CF" />
          <stop offset="25%" stopColor="#F5D268" />
          <stop offset="65%" stopColor="#D4AF37" />
          <stop offset="100%" stopColor="#967112" />
        </linearGradient>
        <linearGradient id="facetLeft" x1="18" y1="24" x2="50" y2="92" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#A87F1B" />
          <stop offset="45%" stopColor="#78560B" />
          <stop offset="100%" stopColor="#4A3403" />
        </linearGradient>
        <linearGradient id="facetRight" x1="82" y1="52" x2="50" y2="92" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#D9AF3A" />
          <stop offset="50%" stopColor="#9C7514" />
          <stop offset="100%" stopColor="#5E4306" />
        </linearGradient>
        <linearGradient id="innerHole" x1="50" y1="28" x2="50" y2="58" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#140D03" />
          <stop offset="45%" stopColor="#291D07" />
          <stop offset="100%" stopColor="#0B0601" />
        </linearGradient>
        <linearGradient id="threadHighlight" x1="32" y1="0" x2="68" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#B88E23" />
          <stop offset="35%" stopColor="#FFF5C2" />
          <stop offset="70%" stopColor="#FFE07A" />
          <stop offset="100%" stopColor="#8F6B12" />
        </linearGradient>
      </defs>
      <polygon points="18,52 50,66 50,92 18,78" fill="url(#facetLeft)" stroke="#3B2802" strokeWidth="0.8" />
      <polygon points="50,66 82,52 82,78 50,92" fill="url(#facetRight)" stroke="#3B2802" strokeWidth="0.8" />
      <line x1="18" y1="52" x2="18" y2="78" stroke="#FFEBA8" strokeWidth="1.2" strokeOpacity="0.75" />
      <line x1="50" y1="66" x2="50" y2="92" stroke="#FFF8D6" strokeWidth="2" strokeOpacity="0.9" />
      <line x1="82" y1="52" x2="82" y2="78" stroke="#8A630A" strokeWidth="1.2" strokeOpacity="0.85" />
      <path d="M 18 78 Q 34 84 50 92" stroke="#5E4306" strokeWidth="1.5" fill="none" />
      <path d="M 50 92 Q 66 84 82 78" stroke="#5E4306" strokeWidth="1.5" fill="none" />
      <polygon points="50,10 82,24 82,52 50,66 18,52 18,24" fill="url(#topFace)" stroke="#F5CF60" strokeWidth="1.2" strokeLinejoin="round" />
      <line x1="50" y1="10" x2="50" y2="25" stroke="#FFFFFF" strokeWidth="1.4" strokeOpacity="0.85" />
      <line x1="82" y1="24" x2="67" y2="33" stroke="#FFF7CC" strokeWidth="1.2" strokeOpacity="0.7" />
      <line x1="82" y1="52" x2="67" y2="45" stroke="#7A560A" strokeWidth="1.2" strokeOpacity="0.6" />
      <line x1="50" y1="66" x2="50" y2="51" stroke="#FFF5C4" strokeWidth="1.6" strokeOpacity="0.85" />
      <line x1="18" y1="52" x2="33" y2="45" stroke="#8F680E" strokeWidth="1.2" strokeOpacity="0.6" />
      <line x1="18" y1="24" x2="33" y2="33" stroke="#FFF7CC" strokeWidth="1.2" strokeOpacity="0.75" />
      <ellipse cx="50" cy="38" rx="29" ry="17" stroke="#FFFADB" strokeWidth="1" strokeOpacity="0.7" strokeDasharray="3 1.5" fill="none" />
      <ellipse cx="50" cy="38" rx="18.5" ry="11" fill="url(#innerHole)" stroke="#593E05" strokeWidth="1.6" />
      <path d="M 33.5 35.5 C 38 39, 62 39, 66.5 35.5" stroke="#1A1103" strokeWidth="2.6" fill="none" />
      <path d="M 33 35 C 38 38.5, 62 38.5, 67 35" stroke="url(#threadHighlight)" strokeWidth="1.6" fill="none" />
      <path d="M 32 39 C 38 43, 62 43, 68 39" stroke="#100A02" strokeWidth="2.8" fill="none" />
      <path d="M 32 38.5 C 38 42.5, 62 42.5, 68 38.5" stroke="url(#threadHighlight)" strokeWidth="1.8" fill="none" />
      <path d="M 32.5 43 C 38 47.5, 62 47.5, 67.5 43" stroke="#0A0601" strokeWidth="3" fill="none" />
      <path d="M 32.5 42.3 C 38 46.8, 62 46.8, 67.5 42.3" stroke="url(#threadHighlight)" strokeWidth="2" fill="none" />
      <path d="M 34 47 C 39 51, 61 51, 66 47" stroke="#080401" strokeWidth="2.8" fill="none" />
      <path d="M 34 46.4 C 39 50.4, 61 50.4, 66 46.4" stroke="url(#threadHighlight)" strokeWidth="1.6" fill="none" />
      <path d="M 37 51 C 41 54.5, 59 54.5, 63 51" stroke="#050300" strokeWidth="2.5" fill="none" />
      <path d="M 37 50.5 C 41 54, 59 54, 63 50.5" stroke="url(#threadHighlight)" strokeWidth="1.4" fill="none" strokeOpacity="0.9" />
      <path d="M 32 38 C 34 32, 66 32, 68 38" stroke="#FFF0B2" strokeWidth="1.3" strokeOpacity="0.95" fill="none" />
      <path d="M 32 38 C 34 44, 66 44, 68 38" stroke="#7A5306" strokeWidth="1" strokeOpacity="0.75" fill="none" />
    </svg>
  </div>

  <div class="card">
    <h3>Realistic 3D Hex Bolt with Precision External Threads</h3>
    <!-- 3D Bolt SVG -->
    <svg width="120" height="150" viewBox="0 0 100 130" fill="none" style="filter: drop-shadow(0 14px 22px rgba(120, 80, 10, 0.42));">
      <defs>
        <!-- Top Hex Crown Sheen -->
        <linearGradient id="boltHeadTop" x1="26" y1="8" x2="74" y2="34" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#FFF7CF" />
          <stop offset="30%" stopColor="#F5D268" />
          <stop offset="70%" stopColor="#D4AF37" />
          <stop offset="100%" stopColor="#967112" />
        </linearGradient>

        <!-- Bolt Head Left Face (Shadowed) -->
        <linearGradient id="boltHeadLeft" x1="26" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#A87F1B" />
          <stop offset="50%" stopColor="#78560B" />
          <stop offset="100%" stopColor="#4A3403" />
        </linearGradient>

        <!-- Bolt Head Right Face (Specular Reflection) -->
        <linearGradient id="boltHeadRight" x1="74" y1="24" x2="50" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#E5C158" />
          <stop offset="45%" stopColor="#B38922" />
          <stop offset="100%" stopColor="#6E4F08" />
        </linearGradient>

        <!-- Cylindrical Shank Gradient (Unthreaded & Core) -->
        <linearGradient id="boltShank" x1="36" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#5E4306" />
          <stop offset="18%" stopColor="#B88E23" />
          <stop offset="40%" stopColor="#FFF2B2" />
          <stop offset="65%" stopColor="#D4AF37" />
          <stop offset="88%" stopColor="#916A10" />
          <stop offset="100%" stopColor="#422D02" />
        </linearGradient>

        <!-- Thread Crest Specular Gleam -->
        <linearGradient id="threadGleam" x1="36" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#B08316" />
          <stop offset="25%" stopColor="#FFECA0" />
          <stop offset="45%" stopColor="#FFFBE6" />
          <stop offset="70%" stopColor="#FFDE6A" />
          <stop offset="100%" stopColor="#785408" />
        </linearGradient>

        <!-- Thread Tooth Side Highlight -->
        <linearGradient id="threadToothLeft" x1="34" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stopColor="#E6BF4C" />
          <stop offset="100%" stopColor="#7A5408" />
        </linearGradient>
      </defs>

      <!-- 1. Bolt Underhead Washer Flange (Integrated Washer Ring) -->
      <ellipse cx="50" cy="46" rx="28" ry="6" fill="#3D2903" />
      <ellipse cx="50" cy="44.5" rx="27.5" ry="5.5" fill="url(#boltHeadRight)" stroke="#F5CF60" strokeWidth="0.8" />

      <!-- 2. Bolt Hex Head 3D Vertical Flats -->
      <!-- Left Flat -->
      <polygon points="26,24 50,34 50,46 26,36" fill="url(#boltHeadLeft)" stroke="#3B2802" strokeWidth="0.8" />
      <!-- Right Flat -->
      <polygon points="50,34 74,24 74,36 50,46" fill="url(#boltHeadRight)" stroke="#3B2802" strokeWidth="0.8" />

      <!-- Vertical Edge Specular Highlights -->
      <line x1="26" y1="24" x2="26" y2="36" stroke="#FFE694" strokeWidth="1.2" strokeOpacity="0.8" />
      <line x1="50" y1="34" x2="50" y2="46" stroke="#FFFCEB" strokeWidth="2.2" strokeOpacity="0.95" />
      <line x1="74" y1="24" x2="74" y2="36" stroke="#7A560A" strokeWidth="1.2" strokeOpacity="0.8" />

      <!-- 3. Bolt Hex Head Top Crown -->
      <polygon
        points="50,6 74,14 74,24 50,34 26,24 26,14"
        fill="url(#boltHeadTop)"
        stroke="#FCE082"
        strokeWidth="1.2"
        strokeLinejoin="round"
      />
      <!-- Top Chamfer Radial Indents / Coin Mark -->
      <ellipse cx="50" cy="20" rx="15" ry="7" stroke="#FFF7CF" strokeWidth="0.9" strokeDasharray="3 1.5" fill="none" opacity="0.85" />
      <line x1="50" y1="6" x2="50" y2="13" stroke="#FFFFFF" strokeWidth="1.2" strokeOpacity="0.9" />
      <line x1="74" y1="14" x2="62" y2="18" stroke="#FFE9A0" strokeWidth="1" strokeOpacity="0.75" />
      <line x1="26" y1="14" x2="38" y2="18" stroke="#FFE9A0" strokeWidth="1" strokeOpacity="0.75" />

      <!-- 4. Unthreaded Shank Body (Smooth Cylinder) -->
      <rect x="36.5" y="46" width="27" height="18" fill="url(#boltShank)" />
      <!-- Shank Center Highlight Line -->
      <line x1="47.5" y1="46" x2="47.5" y2="64" stroke="#FFFCE8" strokeWidth="1.5" strokeOpacity="0.7" />

      <!-- 5. Thread Run-Out Transition -->
      <path d="M 36.5 64 Q 50 67 63.5 65" stroke="#4A3304" strokeWidth="1.8" fill="none" />

      <!-- 6. EXTERNAL HELICAL SCREW THREADS -->
      <!-- Background core cylinder for threads -->
      <rect x="37" y="64" width="26" height="52" fill="url(#boltShank)" />

      <!-- Outer Thread Teeth (Sawtooth Crest Profile on Left & Right Edges) -->
      <!-- Left Edge Teeth -->
      <path d="
        M 37 65   L 34.5 67 L 37 69
        L 34.5 72 L 37 74
        L 34.5 77 L 37 79
        L 34.5 82 L 37 84
        L 34.5 87 L 37 89
        L 34.5 92 L 37 94
        L 34.5 97 L 37 99
        L 34.5 102 L 37 104
        L 34.5 107 L 37 109
        L 34.5 112 L 37 114
      " stroke="#2D1D03" strokeWidth="1.2" fill="url(#threadToothLeft)" />

      <!-- Right Edge Teeth -->
      <path d="
        M 63 67   L 65.5 69 L 63 71
        L 65.5 74 L 63 76
        L 65.5 79 L 63 81
        L 65.5 84 L 63 86
        L 65.5 89 L 63 91
        L 65.5 94 L 63 96
        L 65.5 99 L 63 101
        L 65.5 104 L 63 106
        L 65.5 109 L 63 111
        L 65.5 114 L 63 116
      " stroke="#2D1D03" strokeWidth="1.2" fill="#8C640D" />

      <!-- Diagonal Helical Thread Ridges (Sweeping across front with pitch slope) -->
      <!-- Helical Crest 1 -->
      <path d="M 34.5 67 Q 49 69 65.5 71.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 66 Q 49 68 65.5 70.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 2 -->
      <path d="M 34.5 72 Q 49 74 65.5 76.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 71 Q 49 73 65.5 75.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 3 -->
      <path d="M 34.5 77 Q 49 79 65.5 81.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 76 Q 49 78 65.5 80.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 4 -->
      <path d="M 34.5 82 Q 49 84 65.5 86.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 81 Q 49 83 65.5 85.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 5 -->
      <path d="M 34.5 87 Q 49 89 65.5 91.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 86 Q 49 88 65.5 90.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 6 -->
      <path d="M 34.5 92 Q 49 94 65.5 96.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 91 Q 49 93 65.5 95.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 7 -->
      <path d="M 34.5 97 Q 49 99 65.5 101.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 96 Q 49 98 65.5 100.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 8 -->
      <path d="M 34.5 102 Q 49 104 65.5 106.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 101 Q 49 103 65.5 105.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 9 -->
      <path d="M 34.5 107 Q 49 109 65.5 111.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 106 Q 49 108 65.5 110.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- Helical Crest 10 -->
      <path d="M 34.5 112 Q 49 114 65.5 116.5" stroke="#1F1402" strokeWidth="3" fill="none" />
      <path d="M 34.5 111 Q 49 113 65.5 115.5" stroke="url(#threadGleam)" strokeWidth="2.2" fill="none" />

      <!-- 7. Lead-in Chamfered Dog Point (Bolt Bottom Tip) -->
      <!-- Chamfer body narrowing from 37/63 to 42/58 -->
      <polygon points="36,116 64,116 58,123 42,123" fill="#5E4306" stroke="#291D04" strokeWidth="0.8" />
      <!-- Rounded tip end-face -->
      <ellipse cx="50" cy="123" rx="8" ry="2.8" fill="#1F1402" stroke="#D4AF37" strokeWidth="0.8" />
      <line x1="44" y1="123" x2="56" y2="123" stroke="#FFF7CF" strokeWidth="0.8" strokeOpacity="0.8" />

      <!-- Axial Specular Reflection running down the thread crests -->
      <line x1="47.5" y1="65" x2="47.5" y2="116" stroke="#FFFFFF" strokeWidth="1.2" strokeOpacity="0.45" strokeDasharray="1.5 3.5" />
    </svg>
  </div>
</body>
</html>
